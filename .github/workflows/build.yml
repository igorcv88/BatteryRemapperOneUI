name: Build and Release BatteryRemapper OneUI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Test and build unsigned release APK
        run: |
          gradle test assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            --no-daemon

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > release.keystore

          if [ ! -s release.keystore ]; then
            echo "Decoded keystore is empty."
            exit 1
          fi

      - name: Align and sign APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(
            find "${ANDROID_HOME}/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/BatteryRemapper-OneUI.apk"

          test -f "${UNSIGNED_APK}"
          test -x "${BUILD_TOOLS_DIR}/zipalign"
          test -x "${BUILD_TOOLS_DIR}/apksigner"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -P 16 \
            -f \
            -v \
            4 \
            "${UNSIGNED_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            "${SIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" verify \
            --verbose \
            --print-certs \
            "${SIGNED_APK}"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BatteryRemapper-OneUI-${{ github.run_number }}
          path: app/build/outputs/apk/release/BatteryRemapper-OneUI.apk
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/BatteryRemapper-OneUI.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
