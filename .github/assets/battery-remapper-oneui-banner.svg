<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">BatteryRemapper OneUI</title>
  <desc id="desc">Battery percentage remapping for Samsung One UI using modern Xposed APIs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect x="76" y="82" width="226" height="136" rx="24" fill="none" stroke="#f0f6fc" stroke-width="12"/>
  <rect x="302" y="122" width="22" height="56" rx="7" fill="#f0f6fc"/>
  <rect x="94" y="100" width="171" height="100" rx="14" fill="url(#fill)"/>
  <text x="375" y="132" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">BatteryRemapper OneUI</text>
  <text x="377" y="178" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="24">Configurable SystemUI battery scale • modern Xposed API 102</text>
  <text x="377" y="215" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="22">5% stays 5% • choose 80%, 85% or 90% as displayed 100%</text>
</svg>
